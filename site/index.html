<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoramento de Sapata Coletora — Painel da Corrida</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/uplot/uPlot.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <h1 id="title">Monitoramento de Sapata Coletora</h1>
  <p id="run-date"></p>
  <span id="badge"></span>
  <span id="share"></span>
  <span id="upload"></span>
  <span id="report"></span>
</header>
<div class="layout">
  <aside id="controls"><p class="muted">Controles em breve.</p></aside>
  <main>
    <div id="upload-banner" class="upload-banner" role="status" hidden></div>
    <div id="status">Carregando dados…</div>
    <p id="notice" class="notice" role="status" hidden></p>
    <section id="overview"></section>
    <section id="map"></section>
    <section id="charts"></section>
    <section id="matrix"></section>
    <section id="ranking"></section>
    <section id="classes"></section>
    <section id="stats"></section>
    <section id="quality"></section>
  </main>
</div>
<noscript>Este painel precisa de JavaScript habilitado para funcionar.</noscript>
<div id="drop-overlay" class="drop-overlay" hidden>Solte o CSV para carregar</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/leaflet-heat/leaflet-heat.js"></script>
<script src="vendor/uplot/uPlot.iife.min.js"></script>
<script type="module" src="js/app/main.js"></script>
</body>
</html>
