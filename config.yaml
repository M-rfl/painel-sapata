# config.yaml — WTVB01 Notebook Logger configuration
#
# Run 'python list_serial_ports.py' to discover available serial ports.
# Windows: COM3, COM4, COM5 etc.
# Linux:   /dev/ttyUSB0 or /dev/ttyUSB1
# macOS:   /dev/tty.usbserial-* or /dev/tty.wchusbserial*

# REQUIRED — identify your port by running: python list_serial_ports.py
serial_port: "COM3"

# Connection parameters (defaults shown — change only if reconfigured on sensor)
baudrate: 9600          # WTVB01-485 factory default; valid: 1200/2400/4800/9600/19200/38400/57600/115200
slave_id: 80            # 0x50 hex = 80 decimal — WitMotion WTVB01-485 factory default

# Sampling
sample_interval_seconds: 0.1   # 10 Hz; minimum effective rate on Windows ~0.02s

# Output files
output_folder: "data"
csv_filename_prefix: "wtvb01"

# Logging level (DEBUG / INFO / WARNING / ERROR / CRITICAL)
log_level: "WARNING"
